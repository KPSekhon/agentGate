[package]
name = "agentgate-core"
version = "0.1.0"
edition = "2024"
description = "Cryptographic credential broker core — grant tokens, policy engine, audit trail"
license = "MIT"

[[bin]]
name = "agentgate"
path = "src/main.rs"

[dependencies]
ring = "0.17"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
glob-match = "0.2"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
proptest = "1"
